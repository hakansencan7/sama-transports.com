# Include from the existing nginx http {} context (e.g. sites-enabled).
# Do not replace the current SAMA TRACK server configuration.
limit_req_zone $binary_remote_addr zone=sama_contact:10m rate=10r/m;
map $http_origin $sama_contact_origin {
    default "";
    "https://sama-transports.com" "https://sama-transports.com";
    "https://www.sama-transports.com" "https://www.sama-transports.com";
}

server {
    listen 80;
    listen [::]:80;
    server_name forms.sama-transports.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://forms.sama-transports.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name forms.sama-transports.com;
    ssl_certificate /etc/letsencrypt/live/forms.sama-transports.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.sama-transports.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    access_log off;
    client_max_body_size 6m;
    client_body_timeout 30s;
    error_page 413 = @contact_too_large;
    error_page 429 = @contact_rate_limited;
    # Store proxy buffers in a private temporary area, never under the web root.
    # nginx removes request-body temp files after the request is handled.
    location ~ ^/v1/contact(?:/token)?$ {
        limit_req zone=sama_contact burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host forms.sama-transports.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 125s;
        proxy_send_timeout 30s;
        proxy_request_buffering on;
        proxy_buffering off;
    }
    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_set_header Host forms.sama-transports.com;
        proxy_pass http://127.0.0.1:8091;
    }
    location / { return 404; }
    location @contact_too_large {
        default_type application/json;
        add_header Access-Control-Allow-Origin $sama_contact_origin always;
        add_header Vary Origin always;
        add_header Cache-Control no-store always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 413 '{"ok":false,"message":"The request is too large. Maximum document size: 5 MB."}';
    }
    location @contact_rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin $sama_contact_origin always;
        add_header Vary Origin always;
        add_header Cache-Control no-store always;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"ok":false,"message":"Too many requests. Please wait before trying again."}';
    }
}
